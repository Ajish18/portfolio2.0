name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'   # GitHub runs this roughly every 5–15 min
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot GitHub activity
        run: node scripts/fetch-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
